<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/MLSC-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLSC Timetable</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('mlsc-theme')
        document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body>
  <div id="root">
    <div style="padding:2rem;font-family:sans-serif;background:var(--bg,#fff);color:var(--text-h,#08060d);max-width:600px;margin:0 auto;">
      <h1>MLSC Timetable</h1>
      <p>Quick Time Table Generator for Thapar University students, built by the Microsoft Learn Student Ambassador community (MLSC) at Thapar Institute of Engineering &amp; Technology.</p>
      <p>
        <a href="/privacy" style="color:var(--accent,#004F9E);">Privacy Policy</a> ·
        <a href="/terms" style="color:var(--accent,#004F9E);">Terms of Service</a>
      </p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
